<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="sanitariaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="pipeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="valveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>
    <filter id="glowSanitaria" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#sanitariaBg)" />
  
  <!-- Grid overlay lines for technical blueprints -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1.5">
    <line x1="100" y1="0" x2="100" y2="500" />
    <line x1="200" y1="0" x2="200" y2="500" />
    <line x1="300" y1="0" x2="300" y2="500" />
    <line x1="400" y1="0" x2="400" y2="500" />
    <line x1="500" y1="0" x2="500" y2="500" />
    <line x1="600" y1="0" x2="600" y2="500" />
    <line x1="700" y1="0" x2="700" y2="500" />
    <line x1="0" y1="100" x2="800" y2="100" />
    <line x1="0" y1="200" x2="800" y2="200" />
    <line x1="0" y1="300" x2="800" y2="300" />
    <line x1="0" y1="400" x2="800" y2="400" />
  </g>

  <!-- Water wave glow -->
  <circle cx="400" cy="250" r="180" fill="#0284c7" opacity="0.15" filter="url(#glowSanitaria)" />

  <!-- Piping network -->
  <!-- Horizontal Main Pipeline -->
  <rect x="120" y="235" width="560" height="30" rx="6" fill="url(#pipeGrad)" stroke="#7dd3fc" stroke-width="2" />
  
  <!-- Flanges & joints -->
  <rect x="180" y="225" width="16" height="50" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  <rect x="340" y="225" width="16" height="50" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  <rect x="460" y="225" width="16" height="50" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />
  <rect x="620" y="225" width="16" height="50" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />

  <!-- Vertical T-Junction Pipe -->
  <rect x="260" y="120" width="30" height="130" rx="6" fill="url(#pipeGrad)" stroke="#7dd3fc" stroke-width="2" />
  <rect x="250" y="110" width="50" height="16" rx="3" fill="#0369a1" stroke="#38bdf8" stroke-width="2" />

  <!-- Water Pressure Gauge (Manometer) -->
  <g transform="translate(275, 90)">
    <circle cx="0" cy="0" r="42" fill="#ffffff" stroke="#0284c7" stroke-width="6" />
    <circle cx="0" cy="0" r="36" fill="#f8fafc" />
    <path d="M-25,5 A30,30 0 0,1 25,5" fill="none" stroke="#64748b" stroke-width="3" stroke-dasharray="4,3" />
    <!-- Needle pointing to green zone -->
    <line x1="0" y1="0" x2="16" y2="-20" stroke="#ef4444" stroke-width="3.5" stroke-linecap="round" />
    <circle cx="0" cy="0" r="5" fill="#1e293b" />
    <text x="0" y="22" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0284c7" text-anchor="middle">BAR / PSI</text>
  </g>

  <!-- Red Shutoff Valve -->
  <g transform="translate(400, 250)">
    <!-- Valve Body -->
    <circle cx="0" cy="0" r="28" fill="#1e293b" stroke="#7dd3fc" stroke-width="3" />
    <!-- Valve Wheel Axis -->
    <rect x="-6" y="-60" width="12" height="35" rx="3" fill="#94a3b8" />
    <!-- Round Wheel -->
    <ellipse cx="0" cy="-60" rx="42" ry="12" fill="url(#valveGrad)" stroke="#ffffff" stroke-width="3" />
    <line x1="-30" y1="-60" x2="30" y2="-60" stroke="#fecaca" stroke-width="3" />
  </g>

  <!-- Water Droplets Flow -->
  <g fill="#38bdf8" opacity="0.85">
    <path d="M520,240 C520,240 535,220 535,210 C535,202 528,195 520,195 C512,195 505,202 505,210 C505,220 520,240 520,240 Z" />
    <path d="M570,240 C570,240 580,225 580,217 C580,211 575,206 570,206 C565,206 560,211 560,217 C560,225 570,240 570,240 Z" opacity="0.6" />
  </g>

  <!-- Professional Pipe Wrench (Llave Stilson / Francesa) -->
  <g transform="translate(470, 290) rotate(32)">
    <!-- Handle -->
    <rect x="-14" y="0" width="28" height="150" rx="8" fill="#dc2626" stroke="#b91c1c" stroke-width="2" />
    <rect x="-8" y="20" width="16" height="70" rx="4" fill="#ef4444" />
    <!-- Metallic Jaw mechanism -->
    <rect x="-20" y="-30" width="40" height="36" rx="5" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <!-- Fixed Hook Jaw -->
    <path d="M-20,-30 L-20,-65 L10,-65 L10,-48 L0,-48 L-5,-30 Z" fill="#64748b" stroke="#334155" stroke-width="2" />
    <!-- Serrated teeth -->
    <line x1="-18" y1="-50" x2="8" y2="-50" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="2,2" />
  </g>

  <!-- Badge Text -->
  <rect x="50" y="415" width="260" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <text x="180" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#e0f2fe" text-anchor="middle">SANITARIA DE PRECISIÓN</text>
  
  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#86efac" text-anchor="middle">URGENCIAS 365 DÍAS</text>
</svg>
