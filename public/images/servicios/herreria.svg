<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="herreriaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#475569" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="weldGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    <filter id="sparkGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#herreriaBg)" />

  <!-- Technical blueprint background lines -->
  <g opacity="0.1" stroke="#f59e0b" stroke-width="1.5">
    <circle cx="400" cy="250" r="180" fill="none" />
    <circle cx="400" cy="250" r="120" fill="none" />
    <line x1="0" y1="250" x2="800" y2="250" stroke-dasharray="8,6" />
    <line x1="400" y1="0" x2="400" y2="500" stroke-dasharray="8,6" />
  </g>

  <!-- Security Grating / Rejas Frame in background -->
  <g stroke="url(#metalGrad)" stroke-width="8" stroke-linecap="round" opacity="0.65">
    <rect x="140" y="80" width="520" height="340" rx="12" fill="none" stroke-width="14" stroke="#475569" />
    <!-- Vertical Bars -->
    <line x1="210" y1="80" x2="210" y2="420" />
    <line x1="280" y1="80" x2="280" y2="420" />
    <line x1="350" y1="80" x2="350" y2="420" />
    <line x1="420" y1="80" x2="420" y2="420" />
    <line x1="490" y1="80" x2="490" y2="420" />
    <line x1="560" y1="80" x2="560" y2="420" />
    <line x1="630" y1="80" x2="630" y2="420" />
    <!-- Spear tips on bars -->
    <path d="M210,80 L203,60 L210,45 L217,60 Z" fill="#94a3b8" />
    <path d="M280,80 L273,60 L280,45 L287,60 Z" fill="#94a3b8" />
    <path d="M350,80 L343,60 L350,45 L357,60 Z" fill="#94a3b8" />
    <path d="M420,80 L413,60 L420,45 L427,60 Z" fill="#94a3b8" />
    <path d="M490,80 L483,60 L490,45 L497,60 Z" fill="#94a3b8" />
    <path d="M560,80 L553,60 L560,45 L567,60 Z" fill="#94a3b8" />
    <path d="M630,80 L623,60 L630,45 L637,60 Z" fill="#94a3b8" />
  </g>

  <!-- Heavy Steel Beam (Perfil IPN / Doble T) -->
  <g transform="translate(100, 280)">
    <!-- Top Flange -->
    <polygon points="50,40 280,40 250,15 20,15" fill="#64748b" stroke="#94a3b8" stroke-width="2" />
    <!-- Web (vertical) -->
    <polygon points="120,40 160,40 160,110 120,110" fill="#475569" stroke="#334155" stroke-width="2" />
    <!-- Bottom Flange -->
    <polygon points="20,110 250,110 280,135 50,135" fill="#334155" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Welder's Mask (Careta de soldar fotosensible) -->
  <g transform="translate(480, 160)">
    <!-- Helmet Shell -->
    <path d="M0,40 C0,-20 80,-40 140,-40 C200,-40 220,10 220,70 C220,140 180,190 120,200 C80,205 30,170 10,130 Z" fill="#0f172a" stroke="#475569" stroke-width="5" />
    <!-- Aerodynamic Accents -->
    <path d="M30,30 Q90,10 170,30" fill="none" stroke="#3b82f6" stroke-width="4" stroke-linecap="round" />
    <!-- Visor Window -->
    <rect x="55" y="45" width="90" height="48" rx="8" fill="#15803d" stroke="#22c55e" stroke-width="3" />
    <rect x="62" y="52" width="76" height="34" rx="4" fill="#052e16" />
    <!-- Glass glare reflection -->
    <polygon points="65,55 95,55 80,83 65,83" fill="#4ade80" opacity="0.3" />
  </g>

  <!-- Welding Torch (Torcha MIG / Electrodo) with Sparks -->
  <g transform="translate(360, 310) rotate(-45)">
    <!-- Handle -->
    <rect x="-10" y="30" width="20" height="90" rx="5" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <rect x="-6" y="-10" width="12" height="40" rx="3" fill="#cbd5e1" />
    <!-- Nozzle -->
    <polygon points="-8,-10 8,-10 5,-35 -5,-35" fill="#d97706" stroke="#b45309" stroke-width="1.5" />
    <!-- Contact Tip -->
    <line x1="0" y1="-35" x2="0" y2="-45" stroke="#f59e0b" stroke-width="3" />
  </g>

  <!-- Brilliant Welding Arc & Sparks -->
  <g transform="translate(395, 275)" filter="url(#sparkGlow)">
    <circle cx="0" cy="0" r="16" fill="#ffffff" />
    <circle cx="0" cy="0" r="28" fill="#67e8f9" opacity="0.75" />
    <!-- Flying Sparks -->
    <path d="M0,0 L-40,-60 M0,0 L30,-70 M0,0 L-70,-20 M0,0 L60,-35 M0,0 L-50,40 M0,0 L50,50 M0,0 L-20,70 M0,0 L80,-10" stroke="#fde047" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="-35" cy="-55" r="3" fill="#ffffff" />
    <circle cx="28" cy="-65" r="2.5" fill="#fde047" />
    <circle cx="-65" cy="-18" r="3" fill="#f97316" />
    <circle cx="55" cy="-30" r="2.5" fill="#ffffff" />
    <circle cx="75" cy="-8" r="3" fill="#fde047" />
    <circle cx="-15" cy="65" r="2" fill="#ffffff" />
  </g>

  <!-- Bottom Badges -->
  <rect x="50" y="415" width="270" height="42" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.9" />
  <text x="185" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef3c7" text-anchor="middle">ESTRUCTURAS Y REJAS</text>

  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#bfdbfe" text-anchor="middle">SOLDADURA IN SITU</text>
</svg>
