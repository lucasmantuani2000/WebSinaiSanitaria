<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="yesoBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="studSteel" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#64748b" />
    </linearGradient>
    <linearGradient id="gypsumWhite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <linearGradient id="gypsumGreen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#4ade80" />
    </linearGradient>
    <filter id="laserGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#yesoBg)" />

  <!-- Drywall Ceiling Substructure Blueprint Lines -->
  <g opacity="0.15" stroke="#a5b4fc" stroke-width="1.5">
    <line x1="0" y1="80" x2="800" y2="80" />
    <line x1="0" y1="160" x2="800" y2="160" />
    <line x1="0" y1="240" x2="800" y2="240" />
    <line x1="0" y1="320" x2="800" y2="320" />
  </g>

  <!-- Galvanized Steel Studs Framework (Montantes y Soleras Drywall) -->
  <g transform="translate(100, 60)">
    <!-- Top Track / Solera superior -->
    <rect x="0" y="0" width="580" height="18" rx="2" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />
    <!-- Bottom Track / Solera inferior -->
    <rect x="0" y="320" width="580" height="18" rx="2" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />

    <!-- Vertical C-Studs (Montantes cada 40cm) -->
    <rect x="40" y="16" width="22" height="306" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />
    <!-- Perforations for cabling in studs -->
    <ellipse cx="51" cy="120" rx="6" ry="12" fill="#090d16" />
    <ellipse cx="51" cy="220" rx="6" ry="12" fill="#090d16" />

    <rect x="180" y="16" width="22" height="306" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />
    <ellipse cx="191" cy="120" rx="6" ry="12" fill="#090d16" />
    <ellipse cx="191" cy="220" rx="6" ry="12" fill="#090d16" />

    <rect x="320" y="16" width="22" height="306" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />
    <ellipse cx="331" cy="120" rx="6" ry="12" fill="#090d16" />
    <ellipse cx="331" cy="220" rx="6" ry="12" fill="#090d16" />

    <rect x="460" y="16" width="22" height="306" fill="url(#studSteel)" stroke="#475569" stroke-width="2" />
    <ellipse cx="471" cy="120" rx="6" ry="12" fill="#090d16" />
    <ellipse cx="471" cy="220" rx="6" ry="12" fill="#090d16" />
  </g>

  <!-- Gypsum Board Plasterboard Sheets Partially Mounted -->
  <!-- Standard White Sheet on the Right -->
  <g transform="translate(360, 90)">
    <polygon points="0,0 260,0 260,280 0,280" fill="url(#gypsumWhite)" stroke="#cbd5e1" stroke-width="3" opacity="0.9" />
    <text x="130" y="140" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#94a3b8" text-anchor="middle" letter-spacing="4">DRYWALL STANDARD 12.5mm</text>
    <!-- Screws along edges -->
    <g fill="#334155">
      <circle cx="15" cy="20" r="3" />
      <circle cx="15" cy="80" r="3" />
      <circle cx="15" cy="140" r="3" />
      <circle cx="15" cy="200" r="3" />
      <circle cx="15" cy="260" r="3" />
    </g>
  </g>

  <!-- Green Moisture Resistant Plasterboard (Placa RU antihumedad) -->
  <g transform="translate(180, 130)">
    <polygon points="0,0 180,0 180,240 0,240" fill="url(#gypsumGreen)" stroke="#22c55e" stroke-width="3" opacity="0.95" />
    <text x="90" y="120" font-family="system-ui, sans-serif" font-size="11" font-weight="800" fill="#15803d" text-anchor="middle">RESISTENTE A HUMEDAD (RU)</text>
  </g>

  <!-- Laser Level Projector with Cross-Line Projection -->
  <g transform="translate(110, 290)">
    <!-- Tripod / Base -->
    <polygon points="10,50 70,50 60,30 20,30" fill="#1e293b" />
    <!-- Laser Housing Cube -->
    <rect x="15" y="-15" width="50" height="45" rx="8" fill="#dc2626" stroke="#991b1b" stroke-width="2" />
    <rect x="25" y="-5" width="30" height="25" rx="4" fill="#0f172a" />
    <!-- Laser Lens Dot -->
    <circle cx="40" cy="7" r="4" fill="#22c55e" />
  </g>

  <!-- Laser Beam Crosshair projecting across the whole room -->
  <g filter="url(#laserGlow)">
    <!-- Horizontal green laser line -->
    <line x1="0" y1="297" x2="800" y2="297" stroke="#22c55e" stroke-width="2.5" />
    <line x1="0" y1="297" x2="800" y2="297" stroke="#86efac" stroke-width="1" />
    <!-- Vertical laser line -->
    <line x1="150" y1="0" x2="150" y2="500" stroke="#22c55e" stroke-width="2" stroke-dasharray="8,6" opacity="0.75" />
  </g>

  <!-- Bottom Badges -->
  <rect x="50" y="415" width="280" height="42" rx="10" fill="#0f172a" stroke="#818cf8" stroke-width="1.5" opacity="0.9" />
  <text x="190" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#e0e7ff" text-anchor="middle">YESO Y TABIQUERÍA ACÚSTICA</text>

  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#bbf7d0" text-anchor="middle">ALINEACIÓN LÁSER</text>
</svg>
