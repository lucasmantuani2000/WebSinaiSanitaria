<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="albanileriaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="brickGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#b91c1c" />
      <stop offset="50%" stop-color="#c2410c" />
      <stop offset="100%" stop-color="#9a3412" />
    </linearGradient>
    <linearGradient id="tileGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="trowelSteel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#albanileriaBg)" />

  <!-- Isometric Blueprint Grid -->
  <g opacity="0.1" stroke="#60a5fa" stroke-width="1.5">
    <path d="M0,150 L800,350 M0,250 L800,450 M0,50 L800,250" />
    <path d="M0,350 L800,150 M0,450 L800,250 M0,250 L800,50" />
  </g>

  <!-- Brick Wall Section (Mampostería a la vista) -->
  <g transform="translate(60, 90)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="122" y="0" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="244" y="0" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Row 2 -->
    <rect x="58" y="47" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="180" y="47" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <!-- Row 3 -->
    <rect x="0" y="94" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="122" y="94" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
    <rect x="244" y="94" width="115" height="42" rx="4" fill="url(#brickGrad)" stroke="#64748b" stroke-width="2" />
  </g>

  <!-- Porcelain Tiles Layout (Colocación de cerámicas con crucetas) -->
  <g transform="translate(420, 100)">
    <!-- Tile 1 -->
    <rect x="0" y="0" width="140" height="140" rx="6" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Tile 2 -->
    <rect x="150" y="0" width="140" height="140" rx="6" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Tile 3 -->
    <rect x="0" y="150" width="140" height="140" rx="6" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="2" />
    <!-- Tile 4 -->
    <rect x="150" y="150" width="140" height="140" rx="6" fill="url(#tileGrad)" stroke="#38bdf8" stroke-width="2" />
    
    <!-- Tile leveling spacers / crucetas en las juntas -->
    <g fill="#ef4444">
      <rect x="142" y="65" width="6" height="18" rx="2" />
      <rect x="136" y="71" width="18" height="6" rx="2" />
      
      <rect x="65" y="142" width="18" height="6" rx="2" />
      <rect x="71" y="136" width="6" height="18" rx="2" />

      <circle cx="145" cy="145" r="8" fill="#f59e0b" stroke="#ffffff" stroke-width="2" />
    </g>

    <!-- Calathea marble vein texture on tile -->
    <path d="M20,20 Q60,80 110,60 T130,120" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" />
    <path d="M170,40 Q220,100 270,70" fill="none" stroke="#94a3b8" stroke-width="1.5" opacity="0.4" />
  </g>

  <!-- Spirit Level (Nivel tubular de burbuja) -->
  <g transform="translate(200, 260) rotate(-12)">
    <!-- Body -->
    <rect x="0" y="0" width="280" height="42" rx="8" fill="#eab308" stroke="#ca8a04" stroke-width="3" />
    <rect x="8" y="6" width="264" height="30" rx="4" fill="#facc15" />
    <circle cx="20" cy="21" r="5" fill="#0f172a" />
    <circle cx="260" cy="21" r="5" fill="#0f172a" />
    <!-- Center Vial / Burbuja -->
    <rect x="110" y="10" width="60" height="22" rx="11" fill="#0284c7" stroke="#0f172a" stroke-width="2" />
    <line x1="130" y1="10" x2="130" y2="32" stroke="#ffffff" stroke-width="2" />
    <line x1="150" y1="10" x2="150" y2="32" stroke="#ffffff" stroke-width="2" />
    <!-- Green bubble in the exact center -->
    <ellipse cx="140" cy="21" rx="8" ry="6" fill="#86efac" stroke="#15803d" stroke-width="1" />
  </g>

  <!-- Mason's Trowel (Cuchara de Albañil) -->
  <g transform="translate(160, 280) rotate(24)">
    <!-- Wooden / Rubber Handle -->
    <rect x="0" y="110" width="24" height="65" rx="8" fill="#78350f" stroke="#451a03" stroke-width="2" />
    <!-- Metal stem neck -->
    <path d="M12,110 L12,80 L40,65 L40,50" fill="none" stroke="#64748b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Triangular Blade -->
    <polygon points="40,50 -20,-30 100,-30" fill="url(#trowelSteel)" stroke="#334155" stroke-width="3" />
    <polygon points="40,45 -10,-25 90,-25" fill="#ffffff" opacity="0.3" />
  </g>

  <!-- Bottom Badges -->
  <rect x="50" y="415" width="270" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <text x="185" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#e0f2fe" text-anchor="middle">PORCELANATO Y REFORMAS</text>

  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#eab308" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef08a" text-anchor="middle">NIVELACIÓN PERFECTA</text>
</svg>
