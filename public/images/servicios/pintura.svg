<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="pinturaBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="rollerPaint" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <linearGradient id="freshPaintStroke" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="woodHandle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f" />
      <stop offset="50%" stop-color="#b45309" />
      <stop offset="100%" stop-color="#451a03" />
    </linearGradient>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#pinturaBg)" />

  <!-- Wall Plaster Texture in Background -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <circle cx="200" cy="150" r="80" />
    <circle cx="600" cy="300" r="100" />
  </g>

  <!-- Big Fresh Paint Stripe (Franja de pintura recién aplicada) -->
  <g transform="translate(180, 50)">
    <!-- Wet paint swath -->
    <path d="M0,0 L280,0 C280,180 290,260 270,300 C260,320 240,300 230,310 C210,330 190,305 180,315 C160,330 140,295 120,320 C100,340 70,300 50,325 C30,340 10,310 0,320 Z" fill="url(#freshPaintStroke)" opacity="0.9" />
    <!-- Glossy wet paint reflection streaks -->
    <path d="M50,30 L70,30 L60,250 L40,250 Z" fill="#ffffff" opacity="0.2" />
    <path d="M120,30 L135,30 L130,220 L115,220 Z" fill="#ffffff" opacity="0.15" />
    <path d="M200,30 L220,30 L210,240 L190,240 Z" fill="#ffffff" opacity="0.25" />
    <!-- Paint droplets falling -->
    <circle cx="120" cy="340" r="5" fill="#38bdf8" />
    <circle cx="180" cy="355" r="7" fill="#2563eb" />
    <circle cx="50" cy="350" r="4.5" fill="#60a5fa" />
  </g>

  <!-- Paint Roller Assembly (Rodillo con soporte metálico y mango) -->
  <g transform="translate(360, 110) rotate(-18)">
    <!-- Roller Cylinder (El rodillo de lana) -->
    <rect x="-10" y="0" width="180" height="60" rx="14" fill="url(#rollerPaint)" stroke="#ffffff" stroke-width="2" />
    <!-- Soft wool texture bands -->
    <line x1="20" y1="0" x2="20" y2="60" stroke="#1d4ed8" stroke-width="3" opacity="0.6" />
    <line x1="55" y1="0" x2="55" y2="60" stroke="#1d4ed8" stroke-width="3" opacity="0.6" />
    <line x1="90" y1="0" x2="90" y2="60" stroke="#1d4ed8" stroke-width="3" opacity="0.6" />
    <line x1="125" y1="0" x2="125" y2="60" stroke="#1d4ed8" stroke-width="3" opacity="0.6" />
    <line x1="155" y1="0" x2="155" y2="60" stroke="#1d4ed8" stroke-width="3" opacity="0.6" />

    <!-- Steel rod frame (Varilla de acero plegada) -->
    <path d="M170,30 L200,30 L200,140 L90,140 L90,180" fill="none" stroke="#cbd5e1" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Ergonomic Grip Handle -->
    <rect x="76" y="180" width="28" height="110" rx="8" fill="#1e293b" stroke="#334155" stroke-width="2" />
    <rect x="80" y="200" width="20" height="70" rx="4" fill="#3b82f6" />
    <circle cx="90" cy="275" r="4" fill="#ffffff" />
  </g>

  <!-- Professional Cutting In Brush (Pincel de cerda fina para molduras) -->
  <g transform="translate(560, 240) rotate(35)">
    <!-- Wooden Ergonomic Handle -->
    <polygon points="10,210 26,210 22,90 14,90" fill="url(#woodHandle)" stroke="#451a03" stroke-width="1.5" />
    <!-- Tin Ferrule (Virola metálica de acero inoxidable) -->
    <rect x="6" y="50" width="24" height="40" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <!-- Bristles with blue paint dipped tip -->
    <polygon points="6,50 30,50 34,-10 2,-10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5" />
    <!-- Dipped paint on bristles tip -->
    <polygon points="2,-10 34,-10 33,15 3,15" fill="#38bdf8" />
  </g>

  <!-- Bottom Badges -->
  <rect x="50" y="415" width="280" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <text x="190" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#e0f2fe" text-anchor="middle">LÁTEX LAVABLE Y FACHADAS</text>

  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#f59e0b" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#fef3c7" text-anchor="middle">ACABADOS SIN POLVO</text>
</svg>
