<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="imperBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="membraneRoll" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#cbd5e1" />
      <stop offset="35%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <linearGradient id="asphaltCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="flameGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="80%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
    <filter id="flameGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="500" rx="24" fill="url(#imperBg)" />

  <!-- Rainfall angle lines outside shield -->
  <g stroke="#38bdf8" stroke-width="2" stroke-dasharray="8,10" opacity="0.35">
    <line x1="80" y1="20" x2="40" y2="180" />
    <line x1="140" y1="40" x2="100" y2="200" />
    <line x1="200" y1="10" x2="160" y2="170" />
    <line x1="620" y1="20" x2="580" y2="180" />
    <line x1="680" y1="40" x2="640" y2="200" />
    <line x1="740" y1="10" x2="700" y2="170" />
  </g>

  <!-- Big Protective Waterproof Shield in Background -->
  <g transform="translate(400, 190)">
    <path d="M0,-110 L150,-50 C150,60 80,140 0,170 C-80,140 -150,60 -150,-50 Z" fill="#047857" stroke="#34d399" stroke-width="5" opacity="0.25" />
    <path d="M0,-95 L130,-40 C130,55 70,125 0,150 C-70,125 -130,55 -130,-40 Z" fill="none" stroke="#10b981" stroke-width="2" stroke-dasharray="6,4" opacity="0.4" />
  </g>

  <!-- Unrolled Aluminum Asphalt Membrane Sheet (Membrana extendida) -->
  <g transform="translate(100, 240)">
    <!-- Flat laid membrane -->
    <polygon points="40,90 480,90 420,130 0,130" fill="url(#membraneRoll)" stroke="#64748b" stroke-width="2" />
    <!-- Grid embossed lines in aluminum -->
    <line x1="60" y1="96" x2="420" y2="96" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="40" y1="106" x2="400" y2="106" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />
    <line x1="20" y1="116" x2="380" y2="116" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6,4" />

    <!-- Roll of Membrane (Bobina en espiral cilíndrica) -->
    <g transform="translate(420, -10)">
      <!-- Cylinder Body -->
      <path d="M0,0 L60,-40 L60,80 L0,120 Z" fill="url(#membraneRoll)" stroke="#475569" stroke-width="2" />
      <!-- Top Ellipse face -->
      <ellipse cx="0" cy="0" rx="30" ry="45" fill="url(#asphaltCore)" stroke="#64748b" stroke-width="3" />
      <!-- Concentric core circles of roll layers -->
      <ellipse cx="0" cy="0" rx="20" ry="30" fill="none" stroke="#64748b" stroke-width="2" />
      <ellipse cx="0" cy="0" rx="10" ry="15" fill="#020617" stroke="#334155" stroke-width="2" />
    </g>
  </g>

  <!-- Water Repellent Drops Bouncing Off Surface -->
  <g transform="translate(260, 280)">
    <!-- Droplet 1 -->
    <path d="M0,-30 C15,-30 20,-10 0,0 C-20,-10 -15,-30 0,-30 Z" fill="#38bdf8" stroke="#ffffff" stroke-width="2" />
    <!-- Splashes -->
    <circle cx="-16" cy="-45" r="4" fill="#38bdf8" />
    <circle cx="14" cy="-52" r="3" fill="#7dd3fc" />
    <circle cx="28" cy="-38" r="4.5" fill="#38bdf8" />
  </g>

  <!-- Gas Torch (Soplete Térmico para Soldar Membrana) with Flame -->
  <g transform="translate(540, 210) rotate(-35)">
    <!-- Torch Pipe -->
    <rect x="-6" y="-120" width="12" height="150" rx="3" fill="#94a3b8" stroke="#475569" stroke-width="2" />
    <!-- Burner Bell (Campana difusora) -->
    <path d="M-22,-120 L22,-120 L16,-155 L-16,-155 Z" fill="#334155" stroke="#64748b" stroke-width="2" />
    <!-- Blue/Yellow Gas Flame -->
    <g transform="translate(0, -155)" filter="url(#flameGlow)">
      <path d="M-15,0 Q-20,-50 0,-90 Q20,-50 15,0 Z" fill="url(#flameGrad)" />
      <path d="M-8,0 Q-10,-35 0,-60 Q10,-35 8,0 Z" fill="#ffffff" opacity="0.8" />
    </g>
  </g>

  <!-- Bottom Badges -->
  <rect x="50" y="415" width="280" height="42" rx="10" fill="#0f172a" stroke="#10b981" stroke-width="1.5" opacity="0.9" />
  <text x="190" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#a7f3d0" text-anchor="middle">MEMBRANA ASFÁLTICA 4MM</text>

  <rect x="530" y="415" width="220" height="42" rx="10" fill="#0f172a" stroke="#38bdf8" stroke-width="1.5" opacity="0.9" />
  <text x="640" y="441" font-family="system-ui, sans-serif" font-size="14" font-weight="800" fill="#bae6fd" text-anchor="middle">CERO FILTRACIONES</text>
</svg>
